name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SERVER=""
          if [ -f endpoint ]; then
            SERVER=$(sed -n '1p' endpoint | tr -d '\r')
            case "$SERVER" in \#*) SERVER="" ;; esac
          fi
          make dist VERSION="${VERSION}" SERVER="${SERVER}"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            install.sh
